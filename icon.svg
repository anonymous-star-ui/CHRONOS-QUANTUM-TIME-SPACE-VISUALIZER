<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="110" fill="url(#bg)" stroke="#1e293b" stroke-width="8"/>

  <!-- Outer Quantum Clock Dial -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="6" stroke-dasharray="12 8"/>
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(244, 63, 94, 0.2)" stroke-width="4"/>

  <!-- Atomic Orbital Rings -->
  <ellipse cx="256" cy="256" rx="140" ry="55" fill="none" stroke="#38bdf8" stroke-width="5" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="55" fill="none" stroke="#a855f7" stroke-width="5" transform="rotate(30 256 256)"/>
  <ellipse cx="256" cy="256" rx="140" ry="55" fill="none" stroke="#f43f5e" stroke-width="4" transform="rotate(90 256 256)"/>

  <!-- Core Quantum Nucleus / Pivot -->
  <circle cx="256" cy="256" r="24" fill="url(#neon)"/>
  <circle cx="256" cy="256" r="32" fill="none" stroke="#38bdf8" stroke-width="3" opacity="0.6"/>

  <!-- Clock Hands (Precision Vectors) -->
  <line x1="256" y1="256" x2="256" y2="130" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="350" y2="256" stroke="#38bdf8" stroke-width="6" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="190" y2="322" stroke="#f43f5e" stroke-width="3.5" stroke-linecap="round"/>
</svg>
